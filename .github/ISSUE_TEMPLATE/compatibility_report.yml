name: Compatibility report
description: Your Brunner hardware isn't recognised. Tell us about it; it is how support starts.
labels: [compatibility]
body:
  - type: markdown
    attributes:
      value: |
        How to collect each item: [compatibility report](https://github.com/antialias/mesmer/blob/main/docs/compatibility-report.md).
        Nothing here moves the yoke. Leave out serial numbers and licence keys.
  - type: input
    id: model
    attributes:
      label: Model
      description: CLS-E, CLS-E NG, CLS-E Mk II, joystick, pedals, other. USB or Ethernet. Roughly when bought.
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Controller firmware, from CLS2Sim
      description: For each axis, and CLS2Sim's own version.
      placeholder: "pitch v___, roll v___, CLS2Sim ___"
    validations:
      required: true
  - type: input
    id: status
    attributes:
      label: Mesmer's status line
      placeholder: "Yoke not recognised - see X-Plane's Log.txt"
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: The plugin's lines from Log.txt
      description: Every line containing `[BrunnerDirect]`, after a minute with the yoke on and CLS2Sim closed.
      render: text
    validations:
      required: true
  - type: textarea
    id: usb
    attributes:
      label: USB Hardware Ids
      description: Device Manager > Human Interface Devices > the yoke > Properties > Details > Hardware Ids; the lines starting HID\VID_.
      render: text
  - type: textarea
    id: wishes
    attributes:
      label: What you'd want it to do
      description: Dual yokes, pedals, another simulator, anything.
  - type: checkboxes
    id: tester
    attributes:
      label: Testing
      options:
        - label: I'm happy to test builds on this hardware.
